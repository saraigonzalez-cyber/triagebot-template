{% for t in tickets %}
<tr id="ticket-{{ t.id }}">
  <td>{{ t.id }}</td>
  <td>{{ t.title }}</td>
  <td>{{ t.category }}</td>
  <td>
    <span class="rounded px-2 py-0.5 text-xs text-white {% if t.priority == 'P1' %}bg-red-600{% elif t.priority == 'P2' %}bg-amber-500{% else %}bg-gray-500{% endif %}">{{ t.priority }}</span>
  </td>
  <td>{% for tag in t.tags %}<span class="mr-1 rounded bg-gray-200 px-2 py-0.5 text-xs">{{ tag }}</span>{% endfor %}</td>
  <td>
    <select name="status" hx-patch="/tickets/{{ t.id }}" hx-ext="json-enc" hx-target="#ticket-{{ t.id }}" hx-swap="outerHTML">
      {% for s in ['open', 'in_progress', 'closed'] %}
      <option value="{{ s }}" {% if t.status == s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </td>
  <td>{{ t.created_at | fmt_date }}</td>
  <td>{{ t.updated_at | fmt_date }}</td>
</tr>
{% else %}
<tr><td colspan="8" class="text-center text-gray-500">No hay tickets</td></tr>
{% endfor %}
