<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TriageBot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx-ext-json-enc@2.0.1/json-enc.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { display: inline-flex; }
    body.sinister {
      background-color: #050505;
      background-image:
        radial-gradient(ellipse at top, rgba(127, 29, 29, 0.35), transparent 60%),
        radial-gradient(ellipse at bottom, rgba(69, 10, 10, 0.25), transparent 70%);
      background-attachment: fixed;
      min-height: 100vh;
    }
    .font-creepy { font-family: "Creepster", cursive; letter-spacing: 0.06em; }
    .blood-glow { text-shadow: 0 0 8px rgba(220, 38, 38, 0.7), 0 0 24px rgba(127, 29, 29, 0.6); }
  </style>
</head>
<body class="sinister text-zinc-300">
  <main class="mx-auto max-w-6xl p-6">
    <h1 class="font-creepy blood-glow text-5xl text-red-600">TriageBot</h1>
    <p class="mt-2 text-zinc-500">Tablero de incidencias con clasificación automática por IA. El bot lo ve todo…</p>

    <!-- Formulario de creación -->
    <section class="mt-6 rounded-lg bg-zinc-900/80 p-4 shadow-lg shadow-red-950/40 ring-1 ring-red-900/60">
      <h2 class="text-lg font-semibold text-red-500">Nuevo ticket</h2>
      <form id="ticket-form"
            class="mt-3 grid gap-3"
            hx-post="/tickets"
            hx-ext="json-enc"
            hx-target="#tickets-table-body"
            hx-swap="innerHTML"
            hx-disabled-elt="find button"
            hx-indicator="#loading"
            hx-on::before-request="document.getElementById('form-error').classList.add('hidden')"
            hx-on::after-request="if (event.detail.successful) { this.reset(); document.getElementById('filters').reset(); }">
        <label class="grid gap-1 text-sm">
          <span class="font-medium text-zinc-400">Título</span>
          <input name="title" required maxlength="200"
                 class="rounded border border-zinc-700 bg-zinc-950 px-3 py-2 text-zinc-200 placeholder-zinc-600 focus:border-red-700 focus:outline-none focus:ring-1 focus:ring-red-800"
                 placeholder="La página de login no carga">
        </label>
        <label class="grid gap-1 text-sm">
          <span class="font-medium text-zinc-400">Descripción</span>
          <textarea name="description" required maxlength="5000" rows="3"
                    class="rounded border border-zinc-700 bg-zinc-950 px-3 py-2 text-zinc-200 placeholder-zinc-600 focus:border-red-700 focus:outline-none focus:ring-1 focus:ring-red-800"
                    placeholder="Al pulsar el botón de login sale un error 500…"></textarea>
        </label>
        <div class="flex items-center gap-3">
          <button type="submit"
                  class="rounded bg-red-800 px-4 py-2 text-sm font-semibold text-green-300 shadow-md shadow-red-950 hover:bg-red-700 disabled:cursor-wait disabled:opacity-50">
            Crear ticket
          </button>
          <span id="loading" class="htmx-indicator items-center gap-2 text-sm text-red-400">
            <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" class="opacity-25"></circle>
              <path d="M4 12a8 8 0 018-8" stroke="currentColor" stroke-width="4" class="opacity-75"></path>
            </svg>
            Clasificando…
          </span>
        </div>
        <p id="form-error" role="alert" class="hidden rounded bg-red-950 px-3 py-2 text-sm text-red-300 ring-1 ring-red-800"></p>
      </form>
    </section>

    <!-- Filtros -->
    <section class="mt-6">
      <form id="filters" class="flex flex-wrap gap-3"
            hx-get="/tickets"
            hx-trigger="change, input changed delay:300ms from:find input[name=title]"
            hx-include="#filters"
            hx-target="#tickets-table-body"
            hx-swap="innerHTML">
        <label class="grid gap-1 text-sm">
          <span class="font-medium text-zinc-400">Título</span>
          <input type="search" name="title" placeholder="Buscar por título…"
                 class="rounded border border-zinc-700 bg-zinc-950 px-2 py-1 text-zinc-200 placeholder-zinc-600 focus:border-red-700 focus:outline-none focus:ring-1 focus:ring-red-800">
        </label>
        <label class="grid gap-1 text-sm">
          <span class="font-medium text-zinc-400">Categoría</span>
          <select name="category" class="rounded border border-zinc-700 bg-zinc-950 px-2 py-1 text-zinc-200 placeholder-zinc-600 focus:border-red-700 focus:outline-none focus:ring-1 focus:ring-red-800">
            <option value="">Todos</option>
            {% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
          </select>
        </label>
        <label class="grid gap-1 text-sm">
          <span class="font-medium text-zinc-400">Prioridad</span>
          <select name="priority" class="rounded border border-zinc-700 bg-zinc-950 px-2 py-1 text-zinc-200 placeholder-zinc-600 focus:border-red-700 focus:outline-none focus:ring-1 focus:ring-red-800">
            <option value="">Todos</option>
            {% for p in priorities %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
          </select>
        </label>
        <label class="grid gap-1 text-sm">
          <span class="font-medium text-zinc-400">Estado</span>
          <select name="status" class="rounded border border-zinc-700 bg-zinc-950 px-2 py-1 text-zinc-200 placeholder-zinc-600 focus:border-red-700 focus:outline-none focus:ring-1 focus:ring-red-800">
            <option value="">Todos</option>
            {% for s in statuses %}<option value="{{ s }}">{{ status_labels.get(s, s) }}</option>{% endfor %}
          </select>
        </label>
      </form>
    </section>

    <!-- Estadísticas -->
    <section class="mt-4">
      <button type="button"
              hx-get="/tickets/stats"
              hx-target="#stats-panel"
              hx-swap="innerHTML"
              class="rounded bg-red-800 px-4 py-2 text-sm font-semibold text-green-300 shadow-md shadow-red-950 hover:bg-red-700">
        Ver estadísticas
      </button>
      <div id="stats-panel"></div>
    </section>

    <!-- Tablero -->
    <section class="mt-4">
      {% include "_tickets_table.html" %}
    </section>
  </main>

  <script>
    // Errores del formulario (422 u otros) como mensaje legible, no JSON crudo.
    const FIELD_NAMES = { title: "Título", description: "Descripción" };

    function describeError(xhr) {
      if (xhr.status === 422) {
        try {
          const data = JSON.parse(xhr.responseText);
          if (Array.isArray(data.detail)) {
            return data.detail.map(function (err) {
              const field = FIELD_NAMES[err.loc[err.loc.length - 1]] || "Campo";
              const max = err.ctx && err.ctx.max_length;
              if (err.type === "string_too_short") return field + ": no puede estar vacío.";
              if (err.type === "string_too_long") return field + ": máximo " + max + " caracteres.";
              if (err.type === "missing") return field + ": es obligatorio.";
              return field + ": valor no válido.";
            }).join(" ");
          }
        } catch (e) { /* respuesta no JSON */ }
        return "Los datos introducidos no son válidos.";
      }
      return "Error del servidor (" + xhr.status + "). Inténtalo de nuevo.";
    }

    document.body.addEventListener("htmx:responseError", function (evt) {
      const box = document.getElementById("form-error");
      box.textContent = describeError(evt.detail.xhr);
      box.classList.remove("hidden");
    });
  </script>
</body>
</html>
