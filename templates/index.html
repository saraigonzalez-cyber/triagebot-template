<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TriageBot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx-ext-json-enc@2.0.1/json-enc.js"></script>
  <style>
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { display: inline-flex; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <main class="mx-auto max-w-6xl p-6">
    <h1 class="text-3xl font-bold">TriageBot</h1>
    <p class="mt-2 text-slate-600">Tablero de incidencias con clasificación automática por IA.</p>

    <!-- Formulario de creación -->
    <section class="mt-6 rounded-lg bg-white p-4 shadow-sm ring-1 ring-slate-200">
      <h2 class="text-lg font-semibold">Nuevo ticket</h2>
      <form id="ticket-form"
            class="mt-3 grid gap-3"
            hx-post="/tickets"
            hx-ext="json-enc"
            hx-target="#tickets-table-body"
            hx-swap="innerHTML"
            hx-disabled-elt="find button"
            hx-indicator="#loading"
            hx-on::before-request="document.getElementById('form-error').classList.add('hidden')"
            hx-on::after-request="if (event.detail.successful) { this.reset(); document.getElementById('filters').reset(); }">
        <label class="grid gap-1 text-sm">
          <span class="font-medium">Título</span>
          <input name="title" required maxlength="200"
                 class="rounded border border-slate-300 px-3 py-2"
                 placeholder="La página de login no carga">
        </label>
        <label class="grid gap-1 text-sm">
          <span class="font-medium">Descripción</span>
          <textarea name="description" required maxlength="5000" rows="3"
                    class="rounded border border-slate-300 px-3 py-2"
                    placeholder="Al pulsar el botón de login sale un error 500…"></textarea>
        </label>
        <div class="flex items-center gap-3">
          <button type="submit"
                  class="rounded bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700 disabled:cursor-wait disabled:opacity-50">
            Crear ticket
          </button>
          <span id="loading" class="htmx-indicator items-center gap-2 text-sm text-slate-600">
            <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" class="opacity-25"></circle>
              <path d="M4 12a8 8 0 018-8" stroke="currentColor" stroke-width="4" class="opacity-75"></path>
            </svg>
            Clasificando…
          </span>
        </div>
        <p id="form-error" role="alert" class="hidden rounded bg-red-50 px-3 py-2 text-sm text-red-700"></p>
      </form>
    </section>

    <!-- Filtros -->
    <section class="mt-6">
      <form id="filters" class="flex flex-wrap gap-3"
            hx-get="/tickets"
            hx-trigger="change, input changed delay:300ms from:find input[name=title]"
            hx-include="#filters"
            hx-target="#tickets-table-body"
            hx-swap="innerHTML">
        <label class="grid gap-1 text-sm">
          <span class="font-medium">Título</span>
          <input type="search" name="title" placeholder="Buscar por título…"
                 class="rounded border border-slate-300 bg-white px-2 py-1">
        </label>
        <label class="grid gap-1 text-sm">
          <span class="font-medium">Categoría</span>
          <select name="category" class="rounded border border-slate-300 bg-white px-2 py-1">
            <option value="">Todos</option>
            {% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
          </select>
        </label>
        <label class="grid gap-1 text-sm">
          <span class="font-medium">Prioridad</span>
          <select name="priority" class="rounded border border-slate-300 bg-white px-2 py-1">
            <option value="">Todos</option>
            {% for p in priorities %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
          </select>
        </label>
        <label class="grid gap-1 text-sm">
          <span class="font-medium">Estado</span>
          <select name="status" class="rounded border border-slate-300 bg-white px-2 py-1">
            <option value="">Todos</option>
            {% for s in statuses %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
          </select>
        </label>
      </form>
    </section>

    <!-- Tablero -->
    <section class="mt-4">
      {% include "_tickets_table.html" %}
    </section>
  </main>

  <script>
    // Errores del formulario (422 u otros) como mensaje legible, no JSON crudo.
    const FIELD_NAMES = { title: "Título", description: "Descripción" };

    function describeError(xhr) {
      if (xhr.status === 422) {
        try {
          const data = JSON.parse(xhr.responseText);
          if (Array.isArray(data.detail)) {
            return data.detail.map(function (err) {
              const field = FIELD_NAMES[err.loc[err.loc.length - 1]] || "Campo";
              const max = err.ctx && err.ctx.max_length;
              if (err.type === "string_too_short") return field + ": no puede estar vacío.";
              if (err.type === "string_too_long") return field + ": máximo " + max + " caracteres.";
              if (err.type === "missing") return field + ": es obligatorio.";
              return field + ": valor no válido.";
            }).join(" ");
          }
        } catch (e) { /* respuesta no JSON */ }
        return "Los datos introducidos no son válidos.";
      }
      return "Error del servidor (" + xhr.status + "). Inténtalo de nuevo.";
    }

    document.body.addEventListener("htmx:responseError", function (evt) {
      const box = document.getElementById("form-error");
      box.textContent = describeError(evt.detail.xhr);
      box.classList.remove("hidden");
    });
  </script>
</body>
</html>
